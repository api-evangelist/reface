name: Reface
description: >-
  Reface (NeoCortext, Inc.) is an AI-native consumer app studio best known for its
  flagship Reface face-swap and AI-avatar application, alongside a portfolio of
  generative media apps including Revive (photo animation), Restyle (AI photo and
  video filters), Ink AI (virtual tattoo try-on), BitePal (AI calorie tracking),
  Lightly (AI journaling), Letsy (virtual clothing try-on), and Memomet. Backed by
  a16z, Reface builds and distributes mobile-first generative AI experiences directly
  to consumers via the App Store and Google Play. As of this profile the company
  publishes no public developer API, SDK, or developer portal; its surface is consumer
  applications rather than a programmable platform. This APIs.json profile is a
  company lead in the API Evangelist network awaiting any future developer surface.
